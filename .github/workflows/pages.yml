name: Publish to GitHub Pages

# Builds the editor and publishes it, so anyone can use it from a link with nothing to install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: editor
        run: npm ci
      - name: Test
        working-directory: editor
        run: npx vitest run
      - name: Build
        working-directory: editor
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/dist
      - id: deployment
        uses: actions/deploy-pages@v4
